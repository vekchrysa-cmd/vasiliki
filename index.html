<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Gov.gr Wallet</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wallet G.L.">
<meta name="theme-color" content="#0a1c4a">
<link rel="apple-touch-icon" href="apple-icon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0a1c4a}
iframe{position:absolute;inset:0;display:none;width:100%;height:100%;border:0;background:transparent}
iframe.active{display:block}
/* Menu as half-screen drop / side panel */
#menu{
  display:none;
  width:85%;
  max-width:360px;
  left:0;
  right:auto;
  z-index:100;
  box-shadow:4px 0 24px rgba(0,0,0,.5);
  transition:transform .3s ease;
  transform:translateX(-100%);
}
#menu.active{
  display:block;
  transform:translateX(0);
}
#menu-overlay{
  display:none;
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:90;
}
#menu-overlay.active{display:block}
</style>
</head>
<body>
<iframe id="login"  class="active" src="login.html"></iframe>
<iframe id="detail" src="index_original.html"></iframe>
<iframe id="menu"   src="menu.html"></iframe>
<div id="menu-overlay"></div>
<script>
window.addEventListener("message",function(e){
  if(!e.data||!e.data.nav)return;
  var nav = e.data.nav;
  if(nav === "menu"){
    document.getElementById("menu").classList.add("active");
    document.getElementById("menu-overlay").classList.add("active");
    return;
  }
  // close menu when going elsewhere
  document.getElementById("menu").classList.remove("active");
  document.getElementById("menu-overlay").classList.remove("active");
  document.querySelectorAll("iframe").forEach(function(f){f.classList.remove("active")});
  var f=document.getElementById(nav);
  if(f)f.classList.add("active");
});
document.getElementById("menu-overlay").addEventListener("click", function(){
  document.getElementById("menu").classList.remove("active");
  document.getElementById("menu-overlay").classList.remove("active");
});
</script>
</body>
</html>
